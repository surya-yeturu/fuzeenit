name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Install dependencies for client and server (if needed)
      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        working-directory: ./client
        run: npm ci

      - name: Build client
        working-directory: ./client
        run: npm run build

      # Deploy the built client (found in client/dist) to gh-pages branch using peaceiris/actions-gh-pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./client/dist
          force_orphan: true
          # Optional: keep history on gh-pages
          # keep_files: true

      # Optional: add a .nojekyll file to prevent GitHub Pages from ignoring files starting with underscore
      - name: Add .nojekyll
        run: echo "" > ./client/dist/.nojekyll
        # This file will be included automatically by the previous step because it's in the publish_dir
